name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.20" "pyabf>=2.3" "pytest>=7.0"

      - name: Vendor heka_reader (third-party single-file module)
        run: |
          curl -fSL --retry 3 \
            -o heka_reader.py \
            "https://raw.githubusercontent.com/campagnola/heka_reader/master/heka_reader.py"
          # Copy into a path pytest will pick up via PYTHONPATH below.
          mkdir -p vendor
          mv heka_reader.py vendor/heka_reader.py
          echo "vendor/" >> .git/info/exclude || true

      - name: Run synthetic-data tests (no real HEKA .dat required)
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor
        run: |
          # test_real_dat.py is intentionally skipped on CI: it requires real
          # HEKA .dat files at hard-coded paths. Run it locally for full coverage.
          pytest tests/test_abf2writer.py -v